<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Hexa</title>
</head>
<body class="hexa-page">
    <div class="container">

        <div class="row">

            <div class="col-md-3">
                <div class="inner-container left-side">
                    <img src="img/profile.png" class="profile" alt="Profile image">

                    <p><b id="username">Aleks4nd4r</b></p>
                    <p id="email">as@gmail.com</p>

                    <button id="editAccount" type="button">Edit account</button>
                    <button id="logout">Logout</button>
                </div>
            </div>

            <div class="col-md-9">
                <div class="inner-container right-side">
                    <form id="postForm">
                        <textarea id="postContent" placeholder="Write something and publish it..."></textarea>
                        <button type="submit">Publish</button>
                    </form>
                    <div id="allPostsWrapper"></div>
                </div>
            </div>
        </div>

    </div>

    <div class="custom-modal">
        <form id="editForm">
            <button id="closeModal" type="button">X</button>
            <h2>Edit Account</h2>

            <div>
                <label for="korisnicko_ime">Username:</label>
                <input id="korisnicko_ime" type="text" name="korisnicko_ime" placeholder="niko.nikolic1">
            </div>

            <div>
                <label for="edit_email">Email address:</label>
                <input id="edit_email" type="text" name="register_email" placeholder="niko.nikolic@mail.com">
            </div>

            <div>
                <button>Edit</button>
            </div>
        </form>

        <hr>

        <button id="deleteProfile" type="button">Delete Profile</button>
    </div>

    


    
    <script src="js/Session.js"></script>
    <script src="js/User.js"></script>
    <script src="js/Post.js"></script>
    <script src="js/hexa.js"></script>
</body>
</html>
