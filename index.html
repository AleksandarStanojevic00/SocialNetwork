<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Hexa</title>
</head>
<body>
    <div class="logo">
        <img src="img/logo.png" alt="Hexa Logo">
    </div>
    <h1>Social network for ethical h4ck3rs </h1>
    
   <div class="main-wrapper">
    <form id="loginForm">
        <h2>Login</h2>

        <div class="input-group">
            <label>Email</label>
            <input type="email" name="email" id="login_email" placeholder="as.aleksandar@gmail.com">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" name="lozinka" id="login_lozinka" placeholder="******">
        </div>

        <button type="submit">Login</button>

        <div class="no-acc-register">
        <p>Don't have an account?</p>
        <button id="registracija">Register!</button>
        </div>

    </form>
    </div>

    <div class="custom-modal">
    
        <form id="registrationForm">

            <button id="closeModal">X</button>

            <h2>User Registration</h2>

            <div>
                <label for="korisnicko_ime">Username: *</label>
                <input id="korisnicko_ime" type="text" name="korisnicko_ime" placeholder="as.aleksandar">
            </div>

            <div>
                <label for="email">Email address: *</label>
                <input id="email" type="text" name="register_email" placeholder="as.aleksandar@gmail.com">
            </div>

            <div>
                <label for="lozinka">Password: *</label>
                <input id="lozinka" type="password" name="register_lozinka" placeholder="******">
            </div>

            <div>
                <label for="ponovi_lozinku">Confirm password: *</label>
                <input id="ponovi_lozinku" type="password" name="ponovi_lozinku" placeholder="******">
            </div>

            <div>
                <button>Register</button>
            </div>
        </form>
    </div>

    <script src="js/matrix.js"></script>
    <script src="js/Validator.js"></script> 
    <script src="js/Session.js"></script>
    <script src="js/User.js"></script>     
    <script src="js/app.js"></script>   
</body>
</html>
